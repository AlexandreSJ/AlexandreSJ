name: Commits chart

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/commits-chart.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.COMMITS_TOKEN }}
      - name: Commit chart if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commits.svg
          git diff --cached --quiet || git commit -m "chore: update commits chart"
          git push
